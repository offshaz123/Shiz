<!-- The split ring on white, matching the profile mark.

     Each circle draws ONE arc and the second is offset by half the ring, so
     the two sit opposite each other with an even gap at each join. It used to
     be "24 5.83" on both, which draws two arcs per circle; the offset then put
     the accent arcs exactly on top of the ink ones and the tab icon came out a
     flat teal ring.

     r = 10 on a 32 box and a 25.33 arc are the same proportions as the mark in
     the header: circumference 62.83, two arcs of 25.33 with 6.08 gaps. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#ffffff" />
  <g fill="none" stroke-width="3.4" stroke-linecap="round">
    <circle cx="16" cy="16" r="10" stroke="#0b1a20" stroke-dasharray="25.33 37.5" />
    <circle cx="16" cy="16" r="10" stroke="#069ec1" stroke-dasharray="25.33 37.5" stroke-dashoffset="-31.42" />
  </g>
</svg>
