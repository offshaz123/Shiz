<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <!--
      This page is never linked or shown to visitors. It exists purely as a
      genuinely static HTML file so Netlify's build-time form scanner can
      detect the "lead-inquiry" form definition (Next.js pages are rendered
      through a serverless function and can't be scanned directly). The real
      form in src/components/LeadForm.tsx submits here via fetch.
    -->
    <form name="lead-inquiry" data-netlify="true" netlify-honeypot="_honey" method="POST">
      <input type="hidden" name="form-name" value="lead-inquiry" />
      <input type="text" name="_honey" />
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="industry" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
